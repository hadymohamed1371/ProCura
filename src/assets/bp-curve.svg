<svg xmlns="http://w3.org" viewBox="0 0 600 260" width="600" height="260" fill="none">
  <rect width="600" height="260" rx="12" fill="#ffffff" />
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="60" y1="40" x2="560" y2="40" />
    <line x1="60" y1="90" x2="560" y2="90" />
    <line x1="60" y1="140" x2="560" y2="140" />
    <line x1="60" y1="190" x2="560" y2="190" />
  </g>
  <line x1="60" y1="30" x2="60" y2="210" stroke="#9ca3af" stroke-width="1.5" />
  <line x1="60" y1="210" x2="560" y2="210" stroke="#9ca3af" stroke-width="1.5" />

  <!-- Arterial pressure curve (systolic peak, dicrotic notch, diastolic decay) -->
  <path
    d="M 60 185
       C 85 182, 105 60, 130 55
       C 150 52, 170 105, 190 120
       C 200 112, 208 102, 215 104
       C 228 110, 245 172, 275 185
       C 300 182, 320 60, 345 55
       C 365 52, 385 105, 405 120
       C 415 112, 423 102, 430 104
       C 443 110, 460 172, 490 185
       C 510 182, 530 110, 555 95"
    stroke="#dc2626"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <g fill="#4b5563" font-family="system-ui, -apple-system, sans-serif" font-size="11">
    <text x="12" y="58">120</text>
    <text x="12" y="108">100</text>
    <text x="18" y="188">80</text>
    <text x="130" y="42" text-anchor="middle" fill="#dc2626" font-weight="600">Systolic</text>
    <text x="215" y="92" text-anchor="middle" fill="#374151">Dicrotic notch</text>
    <text x="275" y="205" text-anchor="middle" fill="#374151">Diastolic</text>
    <text x="310" y="238" text-anchor="middle" fill="#6b7280">Time</text>
  </g>
</svg>
